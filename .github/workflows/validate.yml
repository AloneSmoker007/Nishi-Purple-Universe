name: Static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax and static assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: |
          node --check js/ui.js
          node --check js/quest.js
          node --check js/world.js
          node --check js/audio.js
          node --check js/player.js
          node --check js/wishes.js
      - name: Validate SEO and fallback files
        run: |
          test -s robots.txt
          test -s sitemap.xml
          test -s 404.html
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("sitemap.xml").getroot()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in root.findall("s:sitemap/s:loc", ns)]
          urls += [node.text for node in root.findall("s:url/s:loc", ns)]
          assert "https://alonesmoker007.github.io/Nishi-Purple-Universe/" in urls
          robots = open("robots.txt", encoding="utf-8").read()
          assert "https://alonesmoker007.github.io/Nishi-Purple-Universe/sitemap.xml" in robots
          print("SEO and fallback assets: PASS")
          html = open("index.html", encoding="utf-8").read()
          for required in ('id="music-room"', 'id="player-frame"', 'id="player-list"',
                           'id="player-toggle"', 'id="player-local-files"', 'id="player-add-local"'):
              assert required in html, f"Missing music player element: {required}"
          print("Music player markup: PASS")
          player = open("js/player.js", encoding="utf-8").read()
          assert "function syncProgressTimer()" in player
          assert "&& !document.hidden" in player
          assert "window.addEventListener('pagehide'" in player
          assert "window.addEventListener('pageshow'" in player
          assert "setInterval(() => { if (state.playing" not in player
          print("Music timer lifecycle: PASS")
          world = open("js/world.js", encoding="utf-8").read()
          assert "function postProcessingSize()" in world
          assert "high: 0.85, medium: 0.7, low: 0.55" in world
          assert "const shadowSize = state.isMobile ? 1024 : 2048" in world
          print("Adaptive mobile GPU budgets: PASS")
          ui = open("js/ui.js", encoding="utf-8").read()
          resize = ui.split("  resize() {", 1)[1].split("\\n  },", 1)[0]
          assert "classList.add('is-live')" not in resize
          print("WebGL visibility lifecycle: PASS")
          PY
