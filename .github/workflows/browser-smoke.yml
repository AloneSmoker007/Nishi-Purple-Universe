name: Browser smoke tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    name: Desktop and mobile viewport smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run responsive browser smoke tests
        run: node tests/browser-smoke.mjs

  webkit-pin-keypad:
    name: WebKit (Safari engine) iPhone PIN keypad regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit chromium
      - name: Run PIN keypad touch regression tests (WebKit + Chromium)
        run: node tests/pin-keypad-touch.mjs
